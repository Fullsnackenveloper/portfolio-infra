services:
  caddy:
    image: caddy:2
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ./certs:/etc/caddy/certs:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - web

  portfolio-hub:
    image: ghcr.io/msschermer/portfolio-hub:latest
    container_name: portfolio-hub
    restart: unless-stopped
    networks:
      - web

  psi-monitor:
    image: ghcr.io/msschermer/psi-monitor:latest
    container_name: psi-monitor
    restart: unless-stopped
    env_file:
      - ./psi-monitor.env
    volumes:
      - psi_data:/app/data
    networks:
      - web
      
  wcag-translator:
    image: ghcr.io/msschermer/wcag-translator:latest
    container_name: wcag-translator
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      CORS_ORIGIN: "*"
      TRUST_PROXY: "1"
      PUBLIC_RATE_LIMIT: "60"
      API_RATE_LIMIT: "300"
    networks:
      - web

  lead-inbox:
    image: ghcr.io/msschermer/lead-inbox:latest
    container_name: lead-inbox
    restart: unless-stopped
    networks:
      - web

  preflight:
    image: ghcr.io/msschermer/preflight:latest
    container_name: preflight
    restart: unless-stopped
    networks:
      - web

  meta-state-validator:
    image: ghcr.io/msschermer/meta-state-validator:latest
    container_name: meta-state-validator
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
    networks:
      - web

networks:
  web:

volumes:
  caddy_data:
  caddy_config:
  psi_data:
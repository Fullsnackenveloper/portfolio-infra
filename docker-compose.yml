services:
  caddy:
    image: caddy:2
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ./certs:/etc/caddy/certs:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - web

  portfolio-hub:
    image: ghcr.io/msschermer/portfolio-hub:latest
    container_name: portfolio-hub
    restart: unless-stopped
    networks:
      - web

  psi-monitor:
    image: ghcr.io/msschermer/psi-monitor:latest
    container_name: psi-monitor
    restart: unless-stopped
    env_file:
      - ./psi-monitor.env
    volumes:
      - psi_data:/app/data
    networks:
      - web

  lead-inbox:
    image: ghcr.io/msschermer/lead-inbox:latest
    container_name: lead-inbox
    restart: unless-stopped
    networks:
      - web

networks:
  web:

volumes:
  caddy_data:
  caddy_config:
  psi_data: